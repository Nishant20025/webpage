<!doctype html>
<html lang="en">

<head>
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale-1.0"> 
<title>Document</title>
</head>
<style>
#banner
{
width:70%; 
height:400px;
 margin:auto; 
 box-shadow:10px 10px 10px gray;
}
#pic
{ 
width:100%; 20 
height:100%;
}
</style>
<body>
<!--
<h1>creating animated banner by getelement() in js</h1>    
-->
<div id="banner">
    <img id="pic" src="images/p10.jpg"
</br>
<button oneclick="next()">🔜</button>
<button oneclick="prev()" style="margin-left:90%">🔙</button>
<script>
var p = document.getelementbyid("pic")
var c = 1
function changepic( )
{
p.src="images/p"+c+".jpg"
document.title= c
}
function next()
{
    if(c<10)
{
    c++
}
changepic( )
}
function prev()
{
    if(c>1)
{
    c=c-1
}
changepic( )
}
</script>
</div>
</body>
</head>
</html>
